<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Disease Prediction AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --primary-hover: #059669;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #34d399, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-muted);
            font-weight: 300;
            font-size: 1.1rem;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6);
        }

        .upload-area {
            border: 2px dashed var(--card-border);
            border-radius: 16px;
            padding: 2.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            background: rgba(255,255,255, 0.02);
            margin-bottom: 1.5rem;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: rgba(16, 185, 129, 0.05);
        }

        .upload-area input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--primary);
        }

        .upload-text {
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .upload-hint {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        button {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            background: var(--primary);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px 0 rgba(16, 185, 129, 0.39);
        }

        button:hover {
            background: var(--primary-hover);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.23);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .result-container {
            margin-top: 2rem;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-image-wrapper {
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            margin-bottom: 1.5rem;
            position: relative;
        }

        .result-image-wrapper img {
            width: 100%;
            display: block;
            object-fit: cover;
        }

        .result-stats {
            background: rgba(0,0,0,0.2);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-weight: 600;
            font-size: 1.2rem;
            color: var(--primary);
        }

        .confidence-bar-container {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 0.5rem;
        }

        .confidence-bar {
            height: 100%;
            background: var(--primary);
            border-radius: 4px;
            transition: width 1s ease-out;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .card {
                padding: 1.5rem;
            }
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Plant Disease AI</h1>
            <p>Upload a leaf image to diagnose its health instantly</p>
        </div>

        <div class="card">
            <form action="/predict" method="POST" enctype="multipart/form-data">
                <div class="upload-area">
                    <input type="file" name="image" accept="image/*" required onchange="updateFileName(this)">
                    <div class="upload-icon">🍃</div>
                    <div class="upload-text" id="upload-text">Click or drag image here</div>
                    <div class="upload-hint">Supports JPG, PNG</div>
                </div>
                <button type="submit">Analyze Leaf</button>
            </form>

            {% if prediction %}
            <div class="result-container">
                <div class="result-image-wrapper">
                    <img src="{{ image_path }}" alt="Uploaded Leaf">
                </div>
                
                <div class="result-stats">
                    <div class="stat-row">
                        <span class="stat-label">Diagnosis</span>
                        <!-- Clean up the label name for better presentation -->
                        <span class="stat-value">{{ prediction.replace('___', ' - ').replace('_', ' ') }}</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Confidence</span>
                        <span class="stat-value" style="color: #f8fafc;">{{ confidence }}%</span>
                    </div>
                    <div class="confidence-bar-container">
                        <div class="confidence-bar" style="width: {{ confidence }}%;"></div>
                    </div>
                </div>
            </div>
            {% endif %}
        </div>
    </div>

    <script>
        function updateFileName(input) {
            const textElement = document.getElementById('upload-text');
            if (input.files && input.files.length > 0) {
                textElement.innerText = input.files[0].name;
            } else {
                textElement.innerText = "Click or drag image here";
            }
        }
    </script>
</body>
</html>
